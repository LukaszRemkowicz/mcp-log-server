[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-log-server"
version = "0.1.0"
description = "FastMCP log and VPS inspection service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiocache>=0.12.3",
  "authlib>=1.6.0",
  "docker>=7.1.0",
  "factory-boy>=3.3.3",
  "fastmcp>=2.0.0",
  "joserfc>=1.4.0",
  "pydantic>=2.9.0",
  "tortoise-orm[asyncpg]>=0.25.1",
  "typer>=0.24.0",
]

[project.scripts]
commands = "scripts.main:main"
makemigrations = "database.cli:makemigrations"
migrate = "database.cli:migrate"
shell = "scripts.shell:main"
test = "database.cli:test"

[dependency-groups]
dev = [
  "aerich>=0.9.2",
  "black>=24.10.0",
  "isort>=5.13.0",
  "ipython>=9.0.0",
  "mypy>=1.13.0",
  "pip-audit>=2.9.0",
  "pre-commit>=4.5.0",
  "pytest>=8.3.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.15.12",
  "safety>=3.6.1",
]

[tool.black]
line-length = 100
target-version = ["py313"]
force-exclude = '''
^/migrations/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["aiocache", "docker", "docker.errors", "requests"]
ignore_missing_imports = true

[tool.uv]
package = true
constraint-dependencies = [
  "urllib3>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/database", "src/scripts"]

[tool.ruff]
exclude = ["migrations"]
force-exclude = true
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests", "src/scripts/tests"]

[tool.aerich]
tortoise_orm = "database.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"
