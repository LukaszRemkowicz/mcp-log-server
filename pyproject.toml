[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-log-server"
version = "0.1.0"
description = "FastMCP log and VPS inspection service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
]

[dependency-groups]
dev = [
  "black>=24.10.0",
  "isort>=5.13.0",
  "mypy>=1.13.0",
  "pre-commit>=4.5.0",
  "pytest>=8.3.0",
  "ruff>=0.15.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
