[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-log-server"
version = "0.1.0"
description = "FastMCP log and VPS inspection service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiocache>=0.12.3",
  "aerich>=0.9.2",
  "authlib>=1.6.0",
  "factory-boy>=3.3.3",
  "fastmcp>=3.4.4",
  "ipython>=9.0.0",
  "joserfc>=1.7.2",
  "pydantic>=2.9.0",
  "tortoise-orm[asyncpg]>=0.25.1",
  "typer>=0.24.0",
  "django-environ>=0.13.0",
]

[project.scripts]
command = "cli.main:main"
makemigrations = "cli.db:makemigrations"
migrate = "cli.db:migrate"
shell = "cli.shell:main"
test = "cli.test:test"

[dependency-groups]
dev = [
  "black>=26.5.1",
  "mypy>=1.13.0",
  "pip-audit>=2.10.0",
  "pre-commit>=4.6.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=1.4.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.15.17",
  "safety>=3.8.1",
]

[tool.black]
line-length = 100
target-version = ["py313"]
force-exclude = '''
^/migrations/
'''

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["aiocache", "requests"]
ignore_missing_imports = true

[tool.uv]
package = true
constraint-dependencies = [
  "cryptography>=49.0.0",
  "python-multipart>=0.0.32",
  "starlette>=1.3.1",
  "urllib3>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/database"]

[tool.ruff]
exclude = ["migrations"]
force-exclude = true
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests", "src/cli/tests"]

[tool.aerich]
tortoise_orm = "database.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"
