services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_DIR:-/var/lib/mcp-log-server/postgresql}:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: prod-mcp-log-server:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: prod
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8001}
      PYTHONPATH: /app/src
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      FAIL2BAN_SOCKET_PATH: ${FAIL2BAN_SOCKET_PATH:-/var/run/fail2ban/fail2ban.sock}
      # Used by `uv run commands ...` to find this Compose app service.
      # Must match the Compose project name and the `services.app` key.
      COMMANDS_COMPOSE_PROJECT_NAME: mcp-log-server
      COMMANDS_APP_SERVICE: app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
      - /etc/nginx/logs/access.log:/var/log/nginx/access.log:ro
      - /var/log/portfolio/traefik/access.log:/var/log/portfolio/traefik/access.log:ro
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
      - "${FAIL2BAN_LOG_GID:-1}"
    ports:
      - "127.0.0.1:${MCP_PORT_HOST:-8001}:${MCP_PORT:-8001}"
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-log-server.rule=Host(`mcp.${SITE_DOMAIN}`)"
      - "traefik.http.routers.mcp-log-server.entrypoints=websecure"
      - "traefik.http.routers.mcp-log-server.tls=true"
      - "traefik.http.routers.mcp-log-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mcp-log-server.middlewares=mcp-api-security@file,rate-limit@file"
      - "traefik.http.routers.mcp-log-server.service=mcp-log-server"
      - "traefik.http.services.mcp-log-server.loadbalancer.server.port=${MCP_PORT:-8001}"
    command: ["uv", "run", "python", "-m", "main"]

networks:
  traefik_proxy:
    external: true
