name: mcp

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: prod-mcp-log-server:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      socket-app:
        condition: service_started
    environment:
      ENVIRONMENT: prod
      SOCKET_APP_SOCKET_PATH: /run/socket-app/gateway.sock
      DOCKER_SOCKET_APP_TIMEOUT_SECONDS: 60
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8001}
      PYTHONPATH: /app/src
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_JWKS_URI: ${JWT_JWKS_URI}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      SITE_DOMAIN: ${SITE_DOMAIN}
      TLS_CERTIFICATE_SUBDOMAINS: ${TLS_CERTIFICATE_SUBDOMAINS:-admin,stage,mcp}
      PROJECT_MANIFESTS_PATH: ${PROJECT_MANIFESTS_PATH:-/app/project-manifests}
    volumes:
      - socket-app-run:/run/socket-app
      - /var/log:/host/var/log:ro
      - /etc/nginx/logs:/host/etc/nginx/logs:ro
      - /etc/cron.d:/host/etc/cron.d:ro
      - /etc/cron.daily:/host/etc/cron.daily:ro
      - /etc/cron.weekly:/host/etc/cron.weekly:ro
      - /var/spool/cron:/host/var/spool/cron:ro
      - /etc/systemd/system:/host/etc/systemd/system:ro
      - /var/lib/mcp-log-server:/var/lib/mcp-log-server:ro
      - /var/lib/portfolio:/var/lib/portfolio:ro
      - type: bind
        source: ${PROJECT_MANIFESTS_HOST_PATH}
        target: ${PROJECT_MANIFESTS_PATH:-/app/project-manifests}
        read_only: true
    ports:
      - "127.0.0.1:${MCP_PORT_HOST:-8001}:${MCP_PORT:-8001}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "healthcheck",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-log-server.rule=Host(`mcp.${SITE_DOMAIN}`)"
      - "traefik.http.routers.mcp-log-server.entrypoints=websecure"
      - "traefik.http.routers.mcp-log-server.tls=true"
      - "traefik.http.routers.mcp-log-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mcp-log-server.middlewares=mcp-api-security@file,rate-limit@file"
      - "traefik.http.routers.mcp-log-server.service=mcp-log-server"
      - "traefik.http.services.mcp-log-server.loadbalancer.server.port=${MCP_PORT:-8001}"
    command: ["uv", "run", "python", "-m", "main"]

  socket-app:
    image: mcp-socket:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/socket-app/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      SOCKET_APP_SOCKET_PATH: /run/socket-app/gateway.sock
    volumes:
      - socket-app-run:/run/socket-app
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"

volumes:
  postgres-data:
  socket-app-run:

networks:
  traefik_proxy:
    external: true
