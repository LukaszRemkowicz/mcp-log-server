[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "docker-socket-app"
version = "0.1.0"
description = "Internal Unix-socket app for fixed Docker operations"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docker_socket_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
