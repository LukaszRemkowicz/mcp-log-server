name: mcp-local

services:
  db:
    image: mcp-db:18
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-mcp_log_server}
      POSTGRES_USER: ${DATABASE_USER:-mcp_log_server}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mcp-log-server-local-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DATABASE_PORT_HOST:-5437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ${LOGS_DIR_HOST:-./logs}:${LOGS_DIR:-/app/logs}
      - type: bind
        source: ${PROJECT_MANIFESTS_HOST_PATH:-${PROJECT_MANIFESTS_PATH}}
        target: /app/project-manifests
        read_only: true
      - type: bind
        source: ${AGENT_MONITORING_LOGS_HOST_PATH:-../agent-monitoring/logs}
        target: /host/var/log/agent-monitoring
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    environment:
      LOGS_DIR: ${LOGS_DIR:-/app/logs}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-mcp_log_server}
      DATABASE_USER: ${DATABASE_USER:-mcp_log_server}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mcp-log-server-local-password}
      FAIL2BAN_SOCKET_PATH: ${FAIL2BAN_SOCKET_PATH:-/var/run/fail2ban/fail2ban.sock}
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8001}
      PROJECT_MANIFESTS_PATH: /app/project-manifests
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:${MCP_PORT_HOST:-8001}:${MCP_PORT:-8001}"
    command:
      [
        "sh",
        "-lc",
        "uv run migrate && uv run watchfiles --filter all 'python -m main' /app/src",
      ]

  test:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./logs:/app/logs
    environment:
      LOGS_DIR: /app/logs
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: mcp_log_server_test
      DATABASE_USER: mcp_log_server
      DATABASE_PASSWORD: mcp-log-server-local-password
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      PYTHONPATH: /app/src
    command:
      [
        "sh",
        "-lc",
        "uv run python -m database.ensure_test_database && uv run migrate && uv run pytest",
      ]

volumes:
  postgres-data:
