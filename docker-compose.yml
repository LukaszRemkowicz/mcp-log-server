name: mcp-local

services:
  db:
    image: mcp-db:18
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-mcp_log_server}
      POSTGRES_USER: ${DATABASE_USER:-mcp_log_server}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mcp-log-server-local-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DATABASE_PORT_HOST:-5437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    depends_on:
      db:
        condition: service_healthy
      docker-socket-app:
        condition: service_started
      fail2ban-socket-app:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ${LOGS_DIR_HOST:-./logs}:${LOGS_DIR:-/app/logs}
      - type: bind
        source: ${PROJECT_MANIFESTS_HOST_PATH:-${PROJECT_MANIFESTS_PATH}}
        target: /app/project-manifests
        read_only: true
      - type: bind
        source: ${AGENT_MONITORING_LOGS_HOST_PATH:-../agent-monitoring/logs}
        target: /host/var/log/agent-monitoring
        read_only: true
      - docker-socket-app-run:/run/docker-socket-app
      - fail2ban-socket-app-run:/run/fail2ban-socket-app
    environment:
      LOGS_DIR: ${LOGS_DIR:-/app/logs}
      DOCKER_SOCKET_APP_SOCKET_PATH: /run/docker-socket-app/gateway.sock
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-mcp_log_server}
      DATABASE_USER: ${DATABASE_USER:-mcp_log_server}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mcp-log-server-local-password}
      FAIL2BAN_SOCKET_APP_SOCKET_PATH: /run/fail2ban-socket-app/gateway.sock
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8001}
      PROJECT_MANIFESTS_PATH: /app/project-manifests
      PYTHONPATH: /app/src
      SITE_DOMAIN: ${SITE_DOMAIN:-lukaszremkowicz.com}
      TLS_CERTIFICATE_SUBDOMAINS: ${TLS_CERTIFICATE_SUBDOMAINS:-admin,stage,mcp}
    ports:
      - "127.0.0.1:${MCP_PORT_HOST:-8001}:${MCP_PORT:-8001}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "healthcheck",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    command:
      [
        "sh",
        "-lc",
        "uv run migrate && uv run watchfiles --filter all 'python -m main' /app/src",
      ]

  docker-socket-app:
    build:
      context: .
      dockerfile: docker/docker-socket-app/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DOCKER_SOCKET_APP_SOCKET_PATH: /run/docker-socket-app/gateway.sock
    volumes:
      - docker-socket-app-run:/run/docker-socket-app
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"

  fail2ban-socket-app:
    build:
      context: .
      dockerfile: docker/fail2ban-socket-app/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      FAIL2BAN_SOCKET_APP_SOCKET_PATH: /run/fail2ban-socket-app/gateway.sock
      FAIL2BAN_SOCKET_PATH: ${FAIL2BAN_SOCKET_PATH:-/var/run/fail2ban/fail2ban.sock}
    volumes:
      - fail2ban-socket-app-run:/run/fail2ban-socket-app
      - type: bind
        source: ${FAIL2BAN_SOCKET_DIR_HOST:-/var/run/fail2ban}
        target: ${FAIL2BAN_SOCKET_DIR:-/var/run/fail2ban}
        bind:
          create_host_path: false

  test:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./logs:/app/logs
    environment:
      LOGS_DIR: /app/logs
      DOCKER_SOCKET_APP_SOCKET_PATH: /tmp/docker-socket-app-test.sock
      FAIL2BAN_SOCKET_APP_SOCKET_PATH: /tmp/fail2ban-socket-app-test.sock
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: mcp_log_server_test
      DATABASE_USER: mcp_log_server
      DATABASE_PASSWORD: mcp-log-server-local-password
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      PYTHONPATH: /app/src
      SITE_DOMAIN: ${SITE_DOMAIN:-lukaszremkowicz.com}
      TLS_CERTIFICATE_SUBDOMAINS: ${TLS_CERTIFICATE_SUBDOMAINS:-admin,stage,mcp}
    command:
      [
        "sh",
        "-lc",
        "uv run python -m database.ensure_test_database && uv run migrate && uv run pytest",
      ]

volumes:
  postgres-data:
    name: mcp-local_postgres-data
  docker-socket-app-run:
  fail2ban-socket-app-run:
