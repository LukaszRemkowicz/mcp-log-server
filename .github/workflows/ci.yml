name: CI

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality-and-tests:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/python-ci.yml@main
    with:
      python_version: "3.13"
      dependency_install_command: uv sync --group dev
      pre_commit_command: uv run pre-commit run --all-files
      test_command: uv run pytest
      docker_compose_validate_command: docker compose config
      docker_build_command: docker compose build app tests

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: LukaszRemkowicz/ci-cd/.github/workflows/codeql.yml@main
    with:
      languages_json: '["python"]'

  version-check:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/version-check.yml@main
    with:
      base_branch: main
      head_branch: dev

  pr-status:
    needs: [quality-and-tests, codeql, version-check]
    if: always()
    uses: LukaszRemkowicz/ci-cd/.github/workflows/pr-status.yml@main
    with:
      status_items_json: >-
        {"CI (quality, tests, docker build)":"${{ needs.quality-and-tests.result }}","CodeQL":"${{ needs.codeql.result }}","Version Check":"${{ needs.version-check.result }}"}
      success_message: All MCP service CI checks passed.
      failure_message: MCP service CI failed. Please review the workflow logs.
