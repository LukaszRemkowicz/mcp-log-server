name: Add Issues to Project

on:
  issues:
    types:
      - opened
      - reopened
      - transferred

permissions:
  issues: read

jobs:
  add-to-project:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/add-issues-to-project.yml@ba606b6188066fcaf2dc5a7f5a52043ad5457073
    secrets:
      project_token: ${{ secrets.ADD_TO_PROJECT_PAT }}
