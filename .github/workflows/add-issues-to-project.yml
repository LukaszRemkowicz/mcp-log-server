name: Add Issues to Project

on:
  issues:
    types:
      - opened
      - reopened
      - transferred

permissions:
  issues: read

jobs:
  add-to-project:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/add-issues-to-project.yml@main
    secrets:
      project_token: ${{ secrets.ADD_TO_PROJECT_PAT }}
